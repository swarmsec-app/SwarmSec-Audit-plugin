name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev pytest

  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Proof-of-concept suite
        working-directory: tests/poc
        run: forge test
      - name: Every fixture compiles (13-partial-scope is expected to fail on its missing import)
        run: |
          for d in tests/fixtures/*/ tests/fixtures/*/v*/; do
            [ -f "$d/foundry.toml" ] || continue
            case "$d" in *13-partial-scope*) continue ;; esac
            (cd "$d" && forge build) || exit 1
          done

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
